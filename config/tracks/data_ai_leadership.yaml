track_id: data_ai_leadership
title: "Data & AI Leadership: 90-Day Executive Accelerator"
description: >
  A rigorous 90-day program designed to transition experienced MIS and reporting professionals 
  into hands-on Data & AI leaders (Head of Analytics, Director of Insights, AI Program Lead). 
  Focuses on reading, running, and modifying code with AI assistance, evaluating technical architecture, 
  and steering high-impact business decisions.

market_research:
  source: "Analysis of 1,250+ Senior Data & AI Leadership Job Postings across LinkedIn, Indeed, and Executive Search Portals (US/UK/EU/APAC)"
  date: "2025-01-15"
  methodology: "Frequency ranking of required competencies across Head of Analytics, AI Program Lead, and Director of Insights job specifications."

target_roles:
  - "Head of Analytics"
  - "Analytics Manager"
  - "AI Program Lead"
  - "Data and AI Product Lead"
  - "Director of Insights"

learner_baseline:
  description: "Strong in Excel reporting, MIS, and recurring management reporting; limited hands-on SQL/Python/AI; no prior AI team leadership."
  conceptual_bridges:
    - excel_concept: "Pivot Tables & VLOOKUP"
      leadership_concept: "Semantic Models, Star Schemas, and Enterprise Relational Joins"
      business_impact: "Moving from fragile manual spreadsheets to governed single sources of truth."
    - excel_concept: "Manual Weekly MIS Packs"
      leadership_concept: "Automated ELT Pipelines and Self-Serve Executive Dashboards"
      business_impact: "Reducing report latency from 5 days to real-time while cutting reporting overhead by 70%."
    - excel_concept: "SUMIFS & Nested Logic"
      leadership_concept: "SQL Window Functions and Algorithmic Metric Standardization"
      business_impact: "Eliminating metric discrepancies across finance, marketing, and operations."
    - excel_concept: "Financial Pro Formas & What-If Tables"
      leadership_concept: "AI/ML Business Cases, ROI Modeling, and Experimentation Frameworks"
      business_impact: "Preventing costly AI vanity projects through disciplined pre-investment valuation."

