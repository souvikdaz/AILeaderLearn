phases:
  - id: phase_1
    name: "Phase 1: Technical Literacy"
    day_range: [1, 20]
    duration_days: 20
    description: "Build fluency reading, running, and modifying SQL and Python code with AI assistance, mapping Excel skills to enterprise data pipelines and KPIs."
    modules:
      - id: module_1
        code: "M1"
        title: "How Data Flows Through a Business"
        day_range: [1, 5]
        skills: ["Data quality and governance", "Data strategy and AI roadmap"]
        description: "Trace data from transactional systems (OLTP) through ELT pipelines into lakes, warehouses, and marts."
      - id: module_2
        code: "M2"
        title: "Reading and Directing SQL for Analytics Leaders"
        day_range: [6, 10]
        skills: ["Reading SQL and writing simple queries with AI help", "Data quality and governance"]
        description: "Translate Excel VLOOKUP and pivot concepts to relational SQL joins, aggregations, and query audits."
      - id: module_3
        code: "M3"
        title: "Python Notebooks & pandas for Analytics Leaders"
        day_range: [11, 15]
        skills: ["Python for analysts: running and modifying notebooks, pandas basics, debugging with AI assistance"]
        description: "Navigate Jupyter notebooks, inspect pandas data structures, diagnose errors, and verify AI-generated scripts."
      - id: module_4
        code: "M4"
        title: "Metrics, KPIs, and Dashboard Reading"
        day_range: [16, 20]
        skills: ["KPI and metric design (KPI trees, leading vs. lagging indicators, metric definitions)", "BI and semantic models at decision level"]
        description: "Build robust KPI trees, distinguish leading vs lagging indicators, and spot vanity metrics in executive dashboards."

  - id: phase_2
    name: "Phase 2: Operating Model and Data Foundations"
    day_range: [21, 50]
    duration_days: 30
    description: "Design scalable organizational models, govern data quality, architect semantic layers, and lead vendor evaluation."
    modules:
      - id: module_5
        code: "M5"
        title: "Analytics & AI Operating Models"
        day_range: [21, 27]
        skills: ["Analytics and AI operating model (team structure, roles, intake, prioritisation)"]
      - id: module_6
        code: "M6"
        title: "Data Governance & Quality Management"
        day_range: [28, 35]
        skills: ["Data quality and governance"]
      - id: module_7
        code: "M7"
        title: "BI, Semantic Models & Decision Infrastructure"
        day_range: [36, 42]
        skills: ["BI and semantic models at decision level (Power BI or Tableau, vendor evaluation, adoption)"]
      - id: module_8
        code: "M8"
        title: "Data Strategy, Roadmapping & Build vs Buy"
        day_range: [43, 50]
        skills: ["Data strategy and AI roadmap", "Vendor and build-versus-buy decisions"]

  - id: phase_3
    name: "Phase 3: AI Leadership in Practice"
    day_range: [51, 75]
    duration_days: 25
    description: "Lead generative AI and machine learning initiatives, establish evaluation benchmarks, govern AI risk, and build financial cases."
    modules:
      - id: module_9
        code: "M9"
        title: "LLM Fundamentals, Prompting & RAG Architecture"
        day_range: [51, 56]
        skills: ["Generative AI and LLMs: prompting, retrieval-augmented workflows, evaluation of outputs, cost and risk"]
      - id: module_10
        code: "M10"
        title: "Evaluating AI Output & Benchmark Design"
        day_range: [57, 62]
        skills: ["Generative AI and LLMs: prompting, retrieval-augmented workflows, evaluation of outputs, cost and risk"]
      - id: module_11
        code: "M11"
        title: "ML Project Lifecycle & Experimentation"
        day_range: [63, 68]
        skills: ["ML project lifecycle", "Experimentation and A/B test interpretation"]
      - id: module_12
        code: "M12"
        title: "AI Risk, ROI, Budgeting & Hiring AI Teams"
        day_range: [69, 75]
        skills: ["AI risk, responsible use, and compliance basics", "Business cases, ROI, and budgeting for AI and analytics", "Hiring and leading AI, ML, and analytics teams"]

  - id: phase_4
    name: "Phase 4: Executive Readiness"
    day_range: [76, 90]
    duration_days: 15
    description: "Master executive storytelling, drive organizational adoption, ace leadership interviews, and develop your 90-day transition roadmap."
    modules:
      - id: module_13
        code: "M13"
        title: "Executive Storytelling & Stakeholder Influence"
        day_range: [76, 80]
        skills: ["Stakeholder management and executive storytelling"]
      - id: module_14
        code: "M14"
        title: "Change Management & Analytics Adoption"
        day_range: [81, 85]
        skills: ["Change management and adoption"]
      - id: module_15
        code: "M15"
        title: "Interview Mastery & Career Positioning"
        day_range: [86, 90]
        skills: ["Hiring and leading AI, ML, and analytics teams", "Stakeholder management and executive storytelling"]
